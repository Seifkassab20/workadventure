# ==============================================================================
# WorkAdventure Local / Tunnel Override
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.standalone.yaml -f docker-compose.local.yaml up -d
# ==============================================================================

services:
  reverse-proxy:
    command:
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entryPoints.web.address=:80
      - --entryPoints.grpc.address=:50051
    ports:
      - "80:80"
      - "50051:50051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  play:
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - PUSHER_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}/
      - FRONT_URL=/
      - PUBLIC_MAP_STORAGE_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}/map-storage
      - UPLOADER_URL=/uploader
      - ICON_URL=/icon
    labels:
      - "traefik.http.routers.play.rule=PathPrefix(`/`)"
      - "traefik.http.routers.play.entryPoints=web"
      - "traefik.http.routers.play.tls=false"
      - "traefik.http.routers.play-ws.rule=PathPrefix(`/ws/`)"
      - "traefik.http.routers.play-ws.entryPoints=web"
      - "traefik.http.routers.play-ws.tls=false"
      - "traefik.http.routers.room-api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.room-api.entryPoints=grpc"
      - "traefik.http.routers.room-api.tls=false"

  back:
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - PLAY_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}
      - PUBLIC_MAP_STORAGE_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}/map-storage
    labels:
      - "traefik.http.routers.back.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.back.entryPoints=web"
      - "traefik.http.routers.back.tls=false"

  map-storage:
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - PUSHER_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}/
    labels:
      - "traefik.http.routers.map-storage.rule=PathPrefix(`/map-storage`)"
      - "traefik.http.routers.map-storage.entryPoints=web"
      - "traefik.http.routers.map-storage.tls=false"

  uploader:
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - PLAY_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}
      - UPLOADER_URL=/uploader
    labels:
      - "traefik.http.routers.uploader.rule=PathPrefix(`/uploader`)"
      - "traefik.http.routers.uploader.entryPoints=web"
      - "traefik.http.routers.uploader.tls=false"

  icon:
    labels:
      - "traefik.http.routers.icon.rule=PathPrefix(`/icon`)"
      - "traefik.http.routers.icon.entryPoints=web"
      - "traefik.http.routers.icon.tls=false"
      - "traefik.http.routers.lettericons.rule=PathPrefix(`/lettericons`)"
      - "traefik.http.routers.lettericons.entryPoints=web"
      - "traefik.http.routers.lettericons.tls=false"
