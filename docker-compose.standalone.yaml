# ==============================================================================
# WorkAdventure Standalone Production Docker Compose (v1.33.5+)
# ==============================================================================
# Single-server deployment with automatic Let's Encrypt SSL/TLS via Traefik.
#
# Production Usage:
#   docker compose -f docker-compose.standalone.yaml up -d
#
# Local Development / Testing Usage (localhost without SSL):
#   docker compose -f docker-compose.standalone.yaml -f docker-compose.local.yaml up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # REVERSE PROXY: Traefik v3 with Automated Let's Encrypt SSL
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: traefik:v3.6.1
    command:
      - --log.level=${LOG_LEVEL:-INFO}
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # HTTP entrypoint with automated redirection to HTTPS
      - --entryPoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      # HTTPS entrypoint
      - --entryPoints.websecure.address=:443
      # gRPC entrypoint (Room API)
      - --entryPoints.grpc.address=:50051
      # Let's Encrypt ACME TLS challenge
      - --certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${GRPC_PORT:-50051}:50051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt-data:/letsencrypt
    restart: ${RESTART_POLICY:-unless-stopped}

  # ----------------------------------------------------------------------------
  # PLAY: WorkAdventure Frontend, HTTP Pusher, and WebSockets
  # ----------------------------------------------------------------------------
  play:
    image: thecodingmachine/workadventure-play:${VERSION:-v1.33.5}
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - MAP_STORAGE_API_TOKEN=${MAP_STORAGE_API_TOKEN}
      - API_URL=back:50051
      - PUSHER_URL=https://${DOMAIN}/
      - FRONT_URL=/
      - ICON_URL=/icon
      - UPLOADER_URL=/uploader
      - PUBLIC_MAP_STORAGE_URL=https://${DOMAIN}/map-storage
      - INTERNAL_MAP_STORAGE_URL=http://map-storage:3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - START_ROOM_URL=${START_ROOM_URL:-/_/global/workadventure.github.io/map-starter-kit/office.tmj}
      - JITSI_URL=${JITSI_URL:-meet.jit.si}
      - JITSI_PRIVATE_MODE=${JITSI_PRIVATE_MODE:-false}
      - STUN_SERVER=${STUN_SERVER:-stun:stun.l.google.com:19302}
      - ENABLE_MAP_EDITOR=${ENABLE_MAP_EDITOR:-true}
      - MAP_EDITOR_ALLOW_ALL_USERS=${MAP_EDITOR_ALLOW_ALL_USERS:-true}
      - ENABLE_CHAT=${ENABLE_CHAT:-true}
      - ENABLE_CHAT_UPLOAD=${ENABLE_CHAT_UPLOAD:-true}
      - ENABLE_CHAT_ONLINE_LIST=${ENABLE_CHAT_ONLINE_LIST:-true}
      - ENABLE_CHAT_DISCONNECTED_LIST=${ENABLE_CHAT_DISCONNECTED_LIST:-true}
      - ENABLE_TUTORIAL=${ENABLE_TUTORIAL:-true}
      - DISABLE_ANONYMOUS=${DISABLE_ANONYMOUS:-false}
      - ROOM_API_PORT=50051
      - ROOM_API_SECRET_KEY=${ROOM_API_SECRET_KEY:-${SECRET_KEY}}
      - LIVEKIT_HOST=${LIVEKIT_HOST:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    labels:
      - "traefik.enable=true"
      # Play frontend (port 3000)
      - "traefik.http.routers.play.rule=Host(`${DOMAIN}`) && PathPrefix(`/`)"
      - "traefik.http.routers.play.entryPoints=websecure"
      - "traefik.http.routers.play.tls=true"
      - "traefik.http.routers.play.tls.certresolver=myresolver"
      - "traefik.http.routers.play.service=play"
      - "traefik.http.routers.play.priority=1"
      - "traefik.http.services.play.loadbalancer.server.port=3000"
      # Play Pusher WebSockets (port 3001)
      - "traefik.http.routers.play-ws.rule=Host(`${DOMAIN}`) && PathPrefix(`/ws/`)"
      - "traefik.http.routers.play-ws.entryPoints=websecure"
      - "traefik.http.routers.play-ws.tls=true"
      - "traefik.http.routers.play-ws.tls.certresolver=myresolver"
      - "traefik.http.routers.play-ws.service=play-ws"
      - "traefik.http.routers.play-ws.priority=2"
      - "traefik.http.services.play-ws.loadbalancer.server.port=3001"
      # Room API gRPC (port 50051)
      - "traefik.http.routers.room-api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.room-api.entryPoints=grpc"
      - "traefik.http.routers.room-api.service=room-api"
      - "traefik.http.services.room-api.loadbalancer.server.port=50051"
      - "traefik.http.services.room-api.loadbalancer.server.scheme=h2c"
      - "traefik.http.routers.room-api.tls=true"
      - "traefik.http.routers.room-api.tls.certresolver=myresolver"
    restart: ${RESTART_POLICY:-unless-stopped}

  # ----------------------------------------------------------------------------
  # BACK: Game Engine & Proximity Server
  # ----------------------------------------------------------------------------
  back:
    image: thecodingmachine/workadventure-back:${VERSION:-v1.33.5}
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - PLAY_URL=https://${DOMAIN}
      - PUBLIC_MAP_STORAGE_URL=https://${DOMAIN}/map-storage
      - INTERNAL_MAP_STORAGE_URL=http://map-storage:3000
      - MAP_STORAGE_URL=map-storage:50053
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JITSI_URL=${JITSI_URL:-meet.jit.si}
      - ENABLE_MAP_EDITOR=${ENABLE_MAP_EDITOR:-true}
      - STORE_VARIABLES_FOR_LOCAL_MAPS=true
      - ENABLE_CHAT=${ENABLE_CHAT:-true}
      - ENABLE_CHAT_UPLOAD=${ENABLE_CHAT_UPLOAD:-true}
      - MAX_PER_GROUP=${MAX_PER_GROUP:-4}
      - GROUP_RADIUS=${GROUP_RADIUS:-48}
      - MINIMUM_DISTANCE=${MINIMUM_DISTANCE:-64}
      - LIVEKIT_HOST=${LIVEKIT_HOST:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.back.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.back.entryPoints=websecure"
      - "traefik.http.routers.back.middlewares=strip-api-prefix"
      - "traefik.http.routers.back.service=back"
      - "traefik.http.routers.back.priority=2"
      - "traefik.http.routers.back.tls=true"
      - "traefik.http.routers.back.tls.certresolver=myresolver"
      - "traefik.http.services.back.loadbalancer.server.port=8080"
    restart: ${RESTART_POLICY:-unless-stopped}

  # ----------------------------------------------------------------------------
  # MAP STORAGE: Persistent Map Hosting and Map Editor API
  # ----------------------------------------------------------------------------
  map-storage:
    image: thecodingmachine/workadventure-map-storage:${VERSION:-v1.33.5}
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - API_URL=back:50051
      - PATH_PREFIX=/map-storage
      - MAP_STORAGE_API_TOKEN=${MAP_STORAGE_API_TOKEN}
      - ENABLE_BEARER_AUTHENTICATION=true
      - AUTHENTICATION_TOKEN=${AUTHENTICATION_TOKEN:-${MAP_STORAGE_API_TOKEN}}
      - PUSHER_URL=https://${DOMAIN}/
    volumes:
      - map-storage-data:/maps
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-map-storage-prefix.stripprefix.prefixes=/map-storage"
      - "traefik.http.routers.map-storage.rule=Host(`${DOMAIN}`) && PathPrefix(`/map-storage`)"
      - "traefik.http.routers.map-storage.entryPoints=websecure"
      - "traefik.http.routers.map-storage.middlewares=strip-map-storage-prefix"
      - "traefik.http.routers.map-storage.service=map-storage"
      - "traefik.http.routers.map-storage.priority=2"
      - "traefik.http.routers.map-storage.tls=true"
      - "traefik.http.routers.map-storage.tls.certresolver=myresolver"
      - "traefik.http.services.map-storage.loadbalancer.server.port=3000"
    restart: ${RESTART_POLICY:-unless-stopped}

  # ----------------------------------------------------------------------------
  # UPLOADER: File and Avatar Upload Service
  # ----------------------------------------------------------------------------
  uploader:
    image: thecodingmachine/workadventure-uploader:${VERSION:-v1.33.5}
    environment:
      - UPLOADER_URL=https://${DOMAIN}/uploader
      - PLAY_URL=https://${DOMAIN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_API_URL=http://play:3000
      - ENABLE_CHAT_UPLOAD=true
      - UPLOAD_MAX_FILESIZE=${UPLOAD_MAX_FILESIZE:-10485760}
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-uploader-prefix.stripprefix.prefixes=/uploader"
      - "traefik.http.routers.uploader.rule=Host(`${DOMAIN}`) && PathPrefix(`/uploader`)"
      - "traefik.http.routers.uploader.entryPoints=websecure"
      - "traefik.http.routers.uploader.middlewares=strip-uploader-prefix"
      - "traefik.http.routers.uploader.service=uploader"
      - "traefik.http.routers.uploader.priority=2"
      - "traefik.http.routers.uploader.tls=true"
      - "traefik.http.routers.uploader.tls.certresolver=myresolver"
      - "traefik.http.services.uploader.loadbalancer.server.port=8080"
    restart: ${RESTART_POLICY:-unless-stopped}

  # ----------------------------------------------------------------------------
  # ICON: Letter Icon & Favicon Generator
  # ----------------------------------------------------------------------------
  icon:
    image: matthiasluedtke/iconserver:v3.21.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-icon-prefix.stripprefix.prefixes=/icon"
      - "traefik.http.routers.icon.rule=Host(`${DOMAIN}`) && PathPrefix(`/icon`)"
      - "traefik.http.routers.icon.entryPoints=websecure"
      - "traefik.http.routers.icon.middlewares=strip-icon-prefix"
      - "traefik.http.routers.icon.service=icon"
      - "traefik.http.routers.icon.priority=2"
      - "traefik.http.routers.icon.tls=true"
      - "traefik.http.routers.icon.tls.certresolver=myresolver"
      - "traefik.http.services.icon.loadbalancer.server.port=8080"
      # Letter icons redirect target
      - "traefik.http.routers.lettericons.rule=Host(`${DOMAIN}`) && PathPrefix(`/lettericons`)"
      - "traefik.http.routers.lettericons.entryPoints=websecure"
      - "traefik.http.routers.lettericons.service=icon"
      - "traefik.http.routers.lettericons.priority=2"
      - "traefik.http.routers.lettericons.tls=true"
      - "traefik.http.routers.lettericons.tls.certresolver=myresolver"
    restart: ${RESTART_POLICY:-unless-stopped}

  # ----------------------------------------------------------------------------
  # REDIS: In-Memory Presence & Variable Store with Disk Persistence
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: ${RESTART_POLICY:-unless-stopped}

volumes:
  map-storage-data:
  redis-data:
  letsencrypt-data:
