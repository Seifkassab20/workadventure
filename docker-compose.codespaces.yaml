# ==============================================================================
# WorkAdventure GitHub Codespaces & Local Testing Compose
# ==============================================================================
# Self-contained, zero-merge compose file:
# - Traefik listens on Port 80 (HTTP) without conflicting ACME / TLS redirects
# - Pre-configured routing for play, back, map-storage, uploader, icon, and redis
# ==============================================================================

services:
  reverse-proxy:
    image: traefik:v3.6.1
    command:
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entryPoints.web.address=:80
      - --entryPoints.web.forwardedHeaders.insecure=true
      - --entryPoints.grpc.address=:50051
    ports:
      - "80:80"
      - "50051:50051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  play:
    image: thecodingmachine/workadventure-play:${VERSION:-v1.33.5}
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - MAP_STORAGE_API_TOKEN=${MAP_STORAGE_API_TOKEN}
      - API_URL=back:50051
      - DOMAIN=${DOMAIN:-localhost}
      - PUSHER_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}/
      - FRONT_URL=/
      - ICON_URL=/icon
      - UPLOADER_URL=/uploader
      - PUBLIC_MAP_STORAGE_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}/map-storage
      - INTERNAL_MAP_STORAGE_URL=http://map-storage:3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - START_ROOM_URL=${START_ROOM_URL:-/_/global/workadventure.github.io/map-starter-kit/office.tmj}
      - JITSI_URL=${JITSI_URL:-meet.jit.si}
      - JITSI_PRIVATE_MODE=false
      - STUN_SERVER=stun:stun.l.google.com:19302
      - ENABLE_MAP_EDITOR=true
      - MAP_EDITOR_ALLOW_ALL_USERS=true
      - ENABLE_CHAT=true
      - ENABLE_CHAT_UPLOAD=true
      - ENABLE_CHAT_ONLINE_LIST=true
      - ENABLE_CHAT_DISCONNECTED_LIST=true
      - ENABLE_TUTORIAL=true
      - DISABLE_ANONYMOUS=false
      - ROOM_API_PORT=50051
      - ROOM_API_SECRET_KEY=${ROOM_API_SECRET_KEY:-${SECRET_KEY}}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.play.rule=PathPrefix(`/`)"
      - "traefik.http.routers.play.entryPoints=web"
      - "traefik.http.routers.play.tls=false"
      - "traefik.http.routers.play.service=play"
      - "traefik.http.routers.play.priority=1"
      - "traefik.http.services.play.loadbalancer.server.port=3000"
      - "traefik.http.routers.play-ws.rule=PathPrefix(`/ws/`)"
      - "traefik.http.routers.play-ws.entryPoints=web"
      - "traefik.http.routers.play-ws.tls=false"
      - "traefik.http.routers.play-ws.service=play-ws"
      - "traefik.http.routers.play-ws.priority=2"
      - "traefik.http.services.play-ws.loadbalancer.server.port=3001"
      - "traefik.http.routers.room-api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.room-api.entryPoints=grpc"
      - "traefik.http.routers.room-api.tls=false"
      - "traefik.http.routers.room-api.service=room-api"
      - "traefik.http.services.room-api.loadbalancer.server.port=50051"
      - "traefik.http.services.room-api.loadbalancer.server.scheme=h2c"
    restart: unless-stopped

  back:
    image: thecodingmachine/workadventure-back:${VERSION:-v1.33.5}
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - PLAY_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}
      - PUBLIC_MAP_STORAGE_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}/map-storage
      - INTERNAL_MAP_STORAGE_URL=http://map-storage:3000
      - MAP_STORAGE_URL=map-storage:50053
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JITSI_URL=meet.jit.si
      - ENABLE_MAP_EDITOR=true
      - STORE_VARIABLES_FOR_LOCAL_MAPS=true
      - ENABLE_CHAT=true
      - ENABLE_CHAT_UPLOAD=true
      - MAX_PER_GROUP=4
      - GROUP_RADIUS=48
      - MINIMUM_DISTANCE=64
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.back.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.back.entryPoints=web"
      - "traefik.http.routers.back.tls=false"
      - "traefik.http.routers.back.middlewares=strip-api-prefix"
      - "traefik.http.routers.back.service=back"
      - "traefik.http.routers.back.priority=2"
      - "traefik.http.services.back.loadbalancer.server.port=8080"
    restart: unless-stopped

  map-storage:
    image: thecodingmachine/workadventure-map-storage:${VERSION:-v1.33.5}
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - API_URL=back:50051
      - PATH_PREFIX=/map-storage
      - MAP_STORAGE_API_TOKEN=${MAP_STORAGE_API_TOKEN}
      - ENABLE_BEARER_AUTHENTICATION=true
      - AUTHENTICATION_TOKEN=${MAP_STORAGE_API_TOKEN}
      - PUSHER_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}/
    volumes:
      - map-storage-data:/maps
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-map-storage-prefix.stripprefix.prefixes=/map-storage"
      - "traefik.http.routers.map-storage.rule=PathPrefix(`/map-storage`)"
      - "traefik.http.routers.map-storage.entryPoints=web"
      - "traefik.http.routers.map-storage.tls=false"
      - "traefik.http.routers.map-storage.middlewares=strip-map-storage-prefix"
      - "traefik.http.routers.map-storage.service=map-storage"
      - "traefik.http.routers.map-storage.priority=2"
      - "traefik.http.services.map-storage.loadbalancer.server.port=3000"
    restart: unless-stopped

  uploader:
    image: thecodingmachine/workadventure-uploader:${VERSION:-v1.33.5}
    environment:
      - UPLOADER_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}/uploader
      - PLAY_URL=${PROTOCOL:-http}://${DOMAIN:-localhost}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_API_URL=http://play:3000
      - ENABLE_CHAT_UPLOAD=true
      - UPLOAD_MAX_FILESIZE=10485760
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-uploader-prefix.stripprefix.prefixes=/uploader"
      - "traefik.http.routers.uploader.rule=PathPrefix(`/uploader`)"
      - "traefik.http.routers.uploader.entryPoints=web"
      - "traefik.http.routers.uploader.tls=false"
      - "traefik.http.routers.uploader.middlewares=strip-uploader-prefix"
      - "traefik.http.routers.uploader.service=uploader"
      - "traefik.http.routers.uploader.priority=2"
      - "traefik.http.services.uploader.loadbalancer.server.port=8080"
    restart: unless-stopped

  icon:
    image: matthiasluedtke/iconserver:v3.21.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-icon-prefix.stripprefix.prefixes=/icon"
      - "traefik.http.routers.icon.rule=PathPrefix(`/icon`)"
      - "traefik.http.routers.icon.entryPoints=web"
      - "traefik.http.routers.icon.tls=false"
      - "traefik.http.routers.icon.middlewares=strip-icon-prefix"
      - "traefik.http.routers.icon.service=icon"
      - "traefik.http.routers.icon.priority=2"
      - "traefik.http.services.icon.loadbalancer.server.port=8080"
      - "traefik.http.routers.lettericons.rule=PathPrefix(`/lettericons`)"
      - "traefik.http.routers.lettericons.entryPoints=web"
      - "traefik.http.routers.lettericons.tls=false"
      - "traefik.http.routers.lettericons.service=icon"
      - "traefik.http.routers.lettericons.priority=2"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  map-storage-data:
  redis-data:
